# Render Blueprint. Verify plan names against Render's current pricing page before applying.
databases:
  - name: shill-monitor-db
    plan: basic-256mb        # free Postgres instances expire; use a paid plan for persistence
services:
  - type: web                # Web Service so Render can health-check it. A Background Worker also works (see README).
    name: shill-monitor
    runtime: python
    plan: starter            # free web services spin down when idle and would stop monitoring
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: shill-monitor-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: AUTHORIZED_USER_ID
        sync: false
      - key: SESSION_ENCRYPTION_KEY   # auto-generated by Render; encrypts your session in the database.
        generateValue: true           # Don't change it later, or the stored login can't be decrypted.
      - key: FORWARD_CHAT
        value: "@fergbotalgogc"
